---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: docker

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apache:
    name: Apache

    runs-on: ubuntu-latest

    steps:
      - name: Checkout.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start containers.
        run: docker compose up -d --build

      - name: Fix permissions.
        run: docker compose exec -T php bash -c "chown -R www-data:www-data /app/runtime /app/public/assets && chmod -R ug+rwX /app/runtime /app/public/assets"

      - name: Install Node.js and npm.
        run: docker compose exec -T php bash -c "apt-get update && apt-get install -y nodejs npm"

      - name: Composer install.
        run: docker compose exec -T php bash -c "git config --global --add safe.directory /app && composer install --prefer-dist --no-progress --optimize-autoloader"

      - name: Build frontend assets.
        run: docker compose exec -T php npm run build

      - name: Configure test entry point.
        run: docker compose exec -T php bash -c "sed -i 's/index.php/index-test.php/' /app/public/.htaccess"

      - name: Codeception build.
        run: docker compose exec -T php vendor/bin/codecept build

      - name: Codeception tests.
        run: docker compose exec -T php vendor/bin/codecept run
