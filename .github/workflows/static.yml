---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: static analysis

permissions:
  contents: read

jobs:
  phpstan:
    uses: yii2-framework/actions/.github/workflows/phpstan.yml@5ecedd23d27c05222743b68a5b2a92e1cec63eb2 # v2.0.1
    with:
      hook: vendor/bin/codecept build
