---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: static analysis

permissions:
  contents: read

jobs:
  phpstan:
    uses: yii2-framework/actions/.github/workflows/phpstan.yml@fa4dbad3c07a834d647f0f6febf38c1351940119 # v2.0.1
    with:
      hook: vendor/bin/codecept build
